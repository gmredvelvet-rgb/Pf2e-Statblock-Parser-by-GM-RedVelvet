name: Release Module

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update module.json for release
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="${{ github.repository }}"
          jq \
            --arg ver "$VERSION" \
            --arg dl "https://github.com/$REPO/releases/download/v$VERSION/module.zip" \
            '.version = $ver | .download = $dl' \
            module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Create module.zip
        run: |
          zip -r module.zip \
            module.json \
            module/main.js \
            module/statblockparser.js \
            module/text-input.js \
            module/parsers.js \
            module/utils.js \
            templates/ \
            styles/ \
            LICENSE \
            README.md \
            CHANGELOG

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.version.outputs.VERSION }}"
          files: module.zip
          generate_release_notes: true
